name: Verify accepted completion
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: write
jobs:
  verify:
    if: github.event.pull_request.number == 21 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/mobile-list-gestures-20260906'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply exact compiler fixes
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          changes = [
              ('src-tauri/src/commands/outbox.rs', 'ec5456aaae3ace788d15111ea1aae8e652898dc9', ', mask_email,', ','),
              ('src-tauri/src/db/outbox.rs', '501c0bb866d18514c196afa94bf9cc9c23263714', 'format!("{:x}", Sha256::digest(payload.to_string().as_bytes()))', 'Sha256::digest(payload.to_string().as_bytes()).iter().map(|byte| format!("{byte:02x}")).collect::<String>()'),
          ]
          for name, sha, old, new in changes:
              actual = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              if actual != sha:
                  raise RuntimeError('Reviewed source changed: ' + name)
              p = Path(name)
              source = p.read_text()
              if source.count(old) != 1:
                  raise RuntimeError('Expected one edit: ' + name)
              p.write_text(source.replace(old, new, 1))
      - name: Format and commit only reviewed source
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
          git add src-tauri/src/commands/outbox.rs src-tauri/src/db/outbox.rs
          git -c user.name='yhan-sun' -c user.email='304309934+yhan-sun@users.noreply.github.com' commit -m 'feat:修复邮件指纹编码与发送模块编译'
          git push origin HEAD:refs/heads/fix/mobile-list-gestures-20260906
          mkdir -p verification
          git rev-parse HEAD > verification/HEAD.txt
          cp src-tauri/src/commands/outbox.rs verification/commands-outbox.rs
          cp src-tauri/src/db/outbox.rs verification/db-outbox.rs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-native-source
          path: verification/
          retention-days: 1
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf google-chrome-stable fonts-noto-cjk
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust tests
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee verification/rust.log
      - name: Clippy
        if: '!cancelled()'
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | tee verification/clippy.log
      - uses: actions/setup-node@v4
        if: '!cancelled()'
        with:
          node-version: 22
          cache: npm
      - name: Browser verification with Chinese fonts
        if: '!cancelled()'
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
          BETTER_EMAIL_UI_CAPTURE_DIR: verification/screenshots
          TZ: Asia/Shanghai
        run: |
          set -o pipefail
          npm ci
          npm run test:ui 2>&1 | tee verification/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-verification-results
          path: verification/
          retention-days: 2
