name: Apply Startup Composer Performance Fix

on:
  push:
    branches:
      - perf/startup-composer-latency-20260827

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.head_commit.message != 'feat:优化启动与写信窗口打开速度'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout performance branch
        uses: actions/checkout@v4
        with:
          ref: perf/startup-composer-latency-20260827
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch startup and composer lifetime
        run: python scripts/apply-startup-composer-perf.py

      - name: Validate frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npx vitest run src/components/composer/ComposerPrimaryFields.test.tsx src/components/composer/ComposerQuickTools.test.tsx
          npm run build
          git diff --check

      - name: Commit optimized startup path
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/ComposerWindow.tsx src/components/StandaloneComposerApp.tsx src/tauriBridge.ts src/tauriBridge.prod.ts
          git commit -m 'feat:优化启动与写信窗口打开速度'
          git push origin HEAD:perf/startup-composer-latency-20260827
