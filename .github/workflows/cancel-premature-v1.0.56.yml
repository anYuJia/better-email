name: Cancel duplicate v1.0.56 checks
on:
  push:
    branches: [work/cancel-premature-v1.0.56]
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    if: github.repository == 'anYuJia/better-email' && github.actor == 'yhan-sun'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Cancel non-release duplicate runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST repos/${GITHUB_REPOSITORY}/actions/runs/34090446503/cancel || true
          gh api --method POST repos/${GITHUB_REPOSITORY}/actions/runs/34090446501/cancel || true
