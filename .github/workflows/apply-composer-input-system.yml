name: Apply Composer Input System Fix

on:
  push:
    branches:
      - perf/startup-composer-latency-20260827

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.head_commit.message != 'feat:完善写信输入系统与快捷键'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout performance branch
        uses: actions/checkout@v4
        with:
          ref: perf/startup-composer-latency-20260827
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Fix recipient native event typing
        run: python scripts/fix-recipient-native-event.py

      - name: Apply input-system patch
        run: python scripts/apply-composer-input-system.py

      - name: Sync dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate frontend and formatting
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npx vitest run \
            src/components/composer/RecipientField.test.tsx \
            src/components/composer/contactSuggestions.test.ts \
            src/components/composer/ComposerPrimaryFields.test.tsx \
            src/components/composer/ComposerQuickTools.test.tsx
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          git diff --check

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            package-lock.json \
            src/components/composer/RecipientField.tsx \
            src/components/composer/ComposerPrimaryFields.tsx \
            src/components/composer/composer-polish.css \
            src/hooks/useAppShortcuts.ts \
            src-tauri/src/lib.rs
          git commit -m 'feat:完善写信输入系统与快捷键'
          git push origin HEAD:perf/startup-composer-latency-20260827
