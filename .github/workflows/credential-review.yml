name: Credential lifecycle verification
on:
  push:
    branches: [work/credential-gate-20260907]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'anYuJia/better-email' && github.actor == 'yhan-sun'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply checksum-verified source
        shell: python
        run: |
          import base64, gzip, hashlib, json, pathlib, subprocess
          root = pathlib.Path.cwd()
          encoded = ''.join((root / f'.github/credential-patch/{i}.b64').read_text().strip() for i in range(18))
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(raw).hexdigest() != '2e040d6344d8aac94fc464dccacb9c7e53dd0184714328e5e767e0089efee7f6':
              raise RuntimeError('Source transport mismatch')
          envelope = json.loads(raw)
          manifest, patch = envelope['manifest'], envelope['patch'].encode()
          if manifest['base'] != 'e3b93396f39f486c56355a8e3f94242f4d1d11a9' or hashlib.sha256(patch).hexdigest() != manifest['patch_sha256']:
              raise RuntimeError('Baseline or patch mismatch')
          def digest(path):
              if not path.exists(): return None
              data = path.read_bytes()
              return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          seen = set()
          for item in manifest['files']:
              name = item['path']
              relative = pathlib.PurePosixPath(name)
              path = root / name
              if name in seen or relative.is_absolute() or '..' in relative.parts or not name.startswith(('src/', 'src-tauri/src/', 'scripts/', 'docs/quality/')) or path.is_symlink() or not path.resolve().is_relative_to(root):
                  raise RuntimeError('Invalid source path: ' + name)
              seen.add(name)
              if digest(path) != item['before']:
                  raise RuntimeError('Reviewed baseline changed: ' + name)
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          for item in manifest['files']:
              if digest(root / item['path']) != item['after']:
                  raise RuntimeError('Edited source mismatch: ' + item['path'])
          pathlib.Path('/tmp/credential-manifest.json').write_text(json.dumps(manifest))
          print('Verified source files:', len(seen))
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
      - name: Export immutable source without moving branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, pathlib, subprocess, tarfile
          manifest = json.loads(pathlib.Path('/tmp/credential-manifest.json').read_text())
          allowed = {item['path'] for item in manifest['files']}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) | set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          if changed - allowed:
              raise RuntimeError('Unplanned changes: ' + repr(changed - allowed))
          output = pathlib.Path('source-evidence')
          output.mkdir()
          entries = []
          for name in sorted(allowed):
              data = pathlib.Path(name).read_bytes()
              expected = hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
              payload = json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()})
              result = json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/anYuJia/better-email/git/blobs', '--input', '-'], input=payload.encode()))
              if result['sha'] != expected:
                  raise RuntimeError('Export checksum mismatch: ' + name)
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': expected})
          (output / 'publish.json').write_text(json.dumps({'base': manifest['base'], 'entries': entries}, indent=2))
          with tarfile.open(output / 'changes.tar.gz', 'w:gz') as archive:
              for name in sorted(allowed): archive.add(name, arcname=name)
          print(json.dumps(entries, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: credential-source-${{ github.run_id }}
          path: source-evidence/
          retention-days: 3
  native:
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e3b93396f39f486c56355a8e3f94242f4d1d11a9
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: credential-source-${{ github.run_id }}
          path: /tmp/credential-source
      - name: Load reviewed source
        run: |
          test "$(git rev-parse HEAD)" = 'e3b93396f39f486c56355a8e3f94242f4d1d11a9'
          tar -xzf /tmp/credential-source/changes.tar.gz
          mkdir -p native-evidence
          cp /tmp/credential-source/publish.json native-evidence/source.json
      - name: Native system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Full Rust regression
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee native-evidence/rust.log
      - name: Strict native lint
        if: '!cancelled()'
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | tee native-evidence/clippy.log
      - name: Rust format
        if: '!cancelled()'
        run: |
          set -o pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check 2>&1 | tee native-evidence/format.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-native-${{ github.run_id }}
          path: native-evidence/
          retention-days: 7
  frontend:
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e3b93396f39f486c56355a8e3f94242f4d1d11a9
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: credential-source-${{ github.run_id }}
          path: /tmp/credential-source
      - name: Load reviewed source
        run: |
          test "$(git rev-parse HEAD)" = 'e3b93396f39f486c56355a8e3f94242f4d1d11a9'
          tar -xzf /tmp/credential-source/changes.tar.gz
          mkdir -p frontend-evidence
          cp /tmp/credential-source/publish.json frontend-evidence/source.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        id: setup
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable fonts-noto-cjk
      - name: TypeScript and ESLint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee frontend-evidence/lint.log
      - name: Frontend regressions
        if: '!cancelled() && steps.setup.outcome == ''success'''
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-evidence/tests.log
      - name: Build and structural budgets
        if: '!cancelled() && steps.setup.outcome == ''success'''
        run: |
          set -o pipefail
          npm run build:verify 2>&1 | tee frontend-evidence/build.log
      - name: Browser UI regression
        if: '!cancelled() && steps.setup.outcome == ''success'''
        env:
          UI_SMOKE_ARTIFACTS_DIR: frontend-evidence/screenshots
        run: |
          set -o pipefail
          npm run test:ui 2>&1 | tee frontend-evidence/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-frontend-${{ github.run_id }}
          path: frontend-evidence/
          retention-days: 7
