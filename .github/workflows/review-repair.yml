name: Review completion verification
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: write
concurrency:
  group: review-repair-21
  cancel-in-progress: false
jobs:
  repair:
    if: github.event.pull_request.number == 21 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/mobile-list-gestures-20260906' && github.actor == 'yhan-sun'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply checksum-verified final edits
        shell: python
        run: |
          import base64, gzip, hashlib, json, pathlib
          root = pathlib.Path.cwd()
          encoded = ''.join((root / f'.github/final-parts/{i}.b64').read_text().strip() for i in range(5))
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(raw).hexdigest() != '286e0119e9fb3e726133bbeae00e01eef6e5d3acbe7d1071b0fd2298e694943f':
              raise RuntimeError('Transport checksum mismatch')
          planned = []
          seen = set()
          for item in json.loads(raw)['files']:
              name = item['path']
              relative = pathlib.PurePosixPath(name)
              if name in seen or relative.is_absolute() or '..' in relative.parts or not (name.startswith(('src/', 'src-tauri/src/', 'scripts/')) or name in ('eslint.config.mjs', '.github/workflows/release.yml', '.github/workflows/android.yml')):
                  raise RuntimeError('Unexpected source path: ' + name)
              seen.add(name)
              target = root / name
              if target.is_symlink() or not target.resolve().is_relative_to(root):
                  raise RuntimeError('Unsafe source path: ' + name)
              old = target.read_bytes() if target.exists() else None
              before = hashlib.sha1(('blob ' + str(len(old)) + '\0').encode() + old).hexdigest() if old is not None else None
              if before != item['before']:
                  raise RuntimeError('Reviewed source changed: ' + name)
              lines = (old or b'').decode().splitlines(keepends=True)
              for edit in reversed(item['edits']):
                  start, end = edit['start'], edit['end']
                  if not 0 <= start <= end <= len(lines):
                      raise RuntimeError('Invalid edit range: ' + name)
                  lines[start:end] = edit['lines']
              result = ''.join(lines).encode()
              if hashlib.sha256(result).hexdigest() != item['after']:
                  raise RuntimeError('Result checksum mismatch: ' + name)
              planned.append((target, result))
          for target, result in planned:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(result)
          pathlib.Path('/tmp/review-allowed.json').write_text(json.dumps(sorted(seen)))
          print('Verified final edits', len(planned))
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install dependencies and format Rust
        run: |
          npm ci
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
      - name: Verify frontend before committing
        run: |
          npm run lint
          npm test
          npm run build:verify
      - name: Commit verified source to the same review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p review-result
          python3 - <<'PY'
          import base64, json, pathlib, subprocess
          allowed = set(json.load(open('/tmp/review-allowed.json')))
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) | set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          if changed - allowed:
              raise RuntimeError('Unplanned changes: ' + repr(changed - allowed))
          source = sorted(p for p in allowed if not p.startswith('.github/'))
          subprocess.run(['git', 'add', '--', *source], check=True)
          pending = []
          for name in sorted(p for p in allowed if p.startswith('.github/')):
              data = json.dumps({'encoding': 'base64', 'content': base64.b64encode(pathlib.Path(name).read_bytes()).decode()})
              value = json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/anYuJia/better-email/git/blobs', '--input', '-'], input=data.encode()))
              pending.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': value['sha']})
          pathlib.Path('review-result/pending-workflows.json').write_text(json.dumps(pending, indent=2))
          PY
          git -c user.name=yhan-sun -c user.email=304309934+yhan-sun@users.noreply.github.com commit -m 'feat:完成草稿同步交互边界与前端静态检查'
          git push origin HEAD:refs/heads/fix/mobile-list-gestures-20260906
          git rev-parse HEAD > review-result/HEAD.txt
          git rev-parse HEAD^{tree} > review-result/tree.txt
          git archive --format=tar.gz HEAD > review-result/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: review-final-source-${{ github.run_id }}
          path: review-result/
          retention-days: 2
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify native regressions and strict lint
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee review-result/rust.log
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | tee review-result/clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-final-results-${{ github.run_id }}
          path: review-result/
          retention-days: 7
