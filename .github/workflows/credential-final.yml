name: Credential source final verification
on:
  push:
    branches: [work/credential-final-check-20260907]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'anYuJia/better-email' && github.actor == 'yhan-sun'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply exact reviewed edits
        shell: python
        run: |
          import hashlib, json, pathlib
          root = pathlib.Path.cwd()
          files = json.loads((root / '.github/credential-final.json').read_text())['files']
          def digest(data):
              return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          planned = []
          seen = set()
          for item in files:
              name = item['path']
              path = root / name
              if name in seen or not name.startswith(('src/', 'src-tauri/src/', 'scripts/')) or path.is_symlink() or not path.resolve().is_relative_to(root):
                  raise RuntimeError('Invalid source path: ' + name)
              seen.add(name)
              old = path.read_bytes()
              if digest(old) != item['before']:
                  raise RuntimeError('Baseline changed: ' + name)
              result = None
              for transport in (False, True):
                  try:
                      lines = old.decode().splitlines(keepends=True)
                      for edit in reversed(item['edits']):
                          start, end = edit['start'], edit['end']
                          if not 0 <= start <= end <= len(lines): raise RuntimeError('Invalid range')
                          replacement = [json.loads('"' + line + '"') for line in edit['lines']] if transport else edit['lines']
                          lines[start:end] = replacement
                      candidate = ''.join(lines).encode()
                      if digest(candidate) == item['after']:
                          result = candidate
                          break
                  except json.JSONDecodeError:
                      continue
              if result is None:
                  raise RuntimeError('Result checksum mismatch: ' + name)
              planned.append((path, result))
          for path, result in planned: path.write_bytes(result)
          seen.update(['scripts/browserExecutable.mjs', 'scripts/browserExecutable.test.mjs', 'src/credentialApp.integration.test.tsx'])
          pathlib.Path('/tmp/credential-allowed.json').write_text(json.dumps(sorted(seen)))
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust and check diff
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
      - name: Export immutable source without moving branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, pathlib, subprocess, tarfile
          allowed = set(json.load(open('/tmp/credential-allowed.json')))
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) | set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          if changed - allowed: raise RuntimeError('Unexpected changes')
          output = pathlib.Path('source-evidence')
          output.mkdir()
          entries = []
          for name in sorted(allowed):
              data = pathlib.Path(name).read_bytes()
              expected = hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
              payload = json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()})
              result = json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/anYuJia/better-email/git/blobs', '--input', '-'], input=payload.encode()))
              if result['sha'] != expected: raise RuntimeError('Export mismatch')
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': expected})
          (output / 'publish.json').write_text(json.dumps({'base': '596657df472365f686e4cd7d91eef79b79f0c04f', 'entries': entries}, indent=2))
          with tarfile.open(output / 'changes.tar.gz', 'w:gz') as archive:
              for name in sorted(allowed): archive.add(name, arcname=name)
          print(json.dumps(entries, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: credential-final-source-${{ github.run_id }}
          path: source-evidence/
          retention-days: 3
