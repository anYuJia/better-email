name: Apply credential PR main sync
on:
  push:
    branches: [work/credential-rebase-diagnose-20260907]
permissions:
  contents: write
jobs:
  merge:
    if: github.repository == 'anYuJia/better-email' && github.actor == 'yhan-sun'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 50ac5310fb1d3095826d6b023a01ca4076754fd5
          fetch-depth: 0
      - name: Merge exact current main into credential repair
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = '5c77bfe950725aa36c58cb67d4e103253641287f'
          git config user.name yhan-sun
          git config user.email 304309934+yhan-sun@users.noreply.github.com
          git merge --no-ff -m 'feat:同步主分支并保留凭据修复' origin/main
          test -z "$(git status --porcelain)"
          test "$(node -p "require('./package.json').version")" = '1.0.56'
          node scripts/check-release-source.mjs
          git diff HEAD^1 HEAD^2 --check || true
      - name: Push merged source to handoff branch
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/work/credential-merged-source-20260907
          echo "$(git rev-parse HEAD)" > merged-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: credential-merged-head-${{ github.run_id }}
          path: merged-head.txt
          retention-days: 3
