<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/brand/v4/favicon.png" type="image/png" />
    <title>Better Email</title>
    <style>
      :root {
        color-scheme: light;
        --app-bg: #f7f8f7;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --app-bg: #101311;
      }
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--app-bg);
      }
      body {
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Noto Sans CJK SC", system-ui, sans-serif;
      }
    </style>
    <script>
      /* Resolve theme before first paint and report only the static HTML milestone. */
      (function () {
        var theme = 'light';
        try {
          var mode = localStorage.getItem('better-email.theme-mode') || 'system';
          theme = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light';
        } catch (error) {
          /* localStorage may be unavailable; fall back to light. */
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.window = new URLSearchParams(location.search).get('window') === 'compose'
          ? 'compose'
          : 'mailbox';
        try {
          performance.mark('better-email:main-html-bootstrap');
        } catch (error) {
          /* Performance marks are diagnostic-only. */
        }
        try {
          var runtime = window.__TAURI_INTERNALS__;
          if (runtime && typeof runtime.invoke === 'function') {
            runtime.invoke('record_startup_milestone', { milestone: 'main_html_bootstrap' }).catch(function () {});
          }
        } catch (error) {
          /* Startup diagnostics must never block the renderer. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
