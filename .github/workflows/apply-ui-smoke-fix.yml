name: Apply UI Smoke Fix

on:
  push:
    branches:
      - 'ci/fix-ui-smoke-hang-20260827'

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch UI smoke runner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/ui-smoke.mjs')
          text = path.read_text(encoding='utf-8')

          old_timer_decl = "let heartbeatTimer = null;"
          new_timer_decl = "let heartbeatTimer = null;\nlet hardTimeoutTimer = null;"
          if old_timer_decl not in text:
              raise SystemExit('heartbeat timer declaration not found')
          text = text.replace(old_timer_decl, new_timer_decl, 1)

          old_watchdog = '''function startWatchdog() {
            heartbeatTimer = setInterval(() => {
              console.log(`[ui-smoke] heartbeat elapsed=${formatDuration(Date.now() - startedAt)} current=${currentStep}`);
            }, heartbeatMs);
            heartbeatTimer.unref();
          }

          function stopWatchdog() {
            if (heartbeatTimer) clearInterval(heartbeatTimer);
            heartbeatTimer = null;
          }'''

          new_watchdog = '''function startWatchdog() {
            heartbeatTimer = setInterval(() => {
              console.log(`[ui-smoke] heartbeat elapsed=${formatDuration(Date.now() - startedAt)} current=${currentStep}`);
            }, heartbeatMs);
            heartbeatTimer.unref();

            hardTimeoutTimer = setTimeout(() => {
              const elapsed = Date.now() - startedAt;
              console.error(
                `[ui-smoke] HARD TIMEOUT elapsed=${formatDuration(elapsed)} limit=${formatDuration(globalSmokeTimeoutMs)} current=${currentStep}`,
              );
              process.exit(1);
            }, globalSmokeTimeoutMs);
          }

          function stopWatchdog() {
            if (heartbeatTimer) clearInterval(heartbeatTimer);
            heartbeatTimer = null;
            if (hardTimeoutTimer) clearTimeout(hardTimeoutTimer);
            hardTimeoutTimer = null;
          }'''

          if old_watchdog not in text:
              raise SystemExit('watchdog block not found')
          text = text.replace(old_watchdog, new_watchdog, 1)

          function_marker = 'async function fillComposerBody(cdp, value) {'
          function_start = text.find(function_marker)
          if function_start < 0:
              raise SystemExit('fillComposerBody function not found')
          rich_start_marker = '    const richReady = await evalInPage('
          rich_start = text.find(rich_start_marker, function_start)
          if rich_start < 0:
              raise SystemExit('rich editor start marker not found')
          rich_end_marker = '      return;\n    }'
          rich_end = text.find(rich_end_marker, rich_start)
          if rich_end < 0:
              raise SystemExit('rich editor end marker not found')
          rich_end += len(rich_end_marker)
          old_rich = text[rich_start:rich_end]
          required_fragments = [
              "document.querySelector('.composer-richtext-body')",
              'rich.focus()',
              "rich.innerHTML = ''",
              "await cdp.send('Input.insertText', { text: value })",
          ]
          if not all(fragment in old_rich for fragment in required_fragments):
              raise SystemExit('rich editor block safety check failed')

          new_rich = '''    const richPoint = await evalInPage(
              cdp,
              `(() => {
                const rich = document.querySelector('.composer-richtext-body');
                if (!rich) return null;
                const rect = rich.getBoundingClientRect();
                if (rect.width <= 0 || rect.height <= 0) return null;
                return {
                  x: rect.left + Math.max(1, Math.min(16, rect.width / 2)),
                  y: rect.top + Math.max(1, Math.min(16, rect.height / 2)),
                };
              })()`,
            );
            if (richPoint) {
              // Keep rich-editor focus and mutation on Chrome's real input path.
              // Calling focus()/innerHTML from Runtime.evaluate can wedge a long
              // CDP session while React/contenteditable handlers are settling.
              await cdp.send('Input.dispatchMouseEvent', {
                type: 'mousePressed',
                x: richPoint.x,
                y: richPoint.y,
                button: 'left',
                buttons: 1,
                clickCount: 1,
              });
              await cdp.send('Input.dispatchMouseEvent', {
                type: 'mouseReleased',
                x: richPoint.x,
                y: richPoint.y,
                button: 'left',
                buttons: 0,
                clickCount: 1,
              });
              await cdp.send('Input.dispatchKeyEvent', {
                type: 'rawKeyDown',
                key: 'a',
                code: 'KeyA',
                windowsVirtualKeyCode: 65,
                modifiers: 2,
              });
              await cdp.send('Input.dispatchKeyEvent', {
                type: 'keyUp',
                key: 'a',
                code: 'KeyA',
                windowsVirtualKeyCode: 65,
                modifiers: 2,
              });
              await cdp.send('Input.dispatchKeyEvent', {
                type: 'rawKeyDown',
                key: 'Backspace',
                code: 'Backspace',
                windowsVirtualKeyCode: 8,
              });
              await cdp.send('Input.dispatchKeyEvent', {
                type: 'keyUp',
                key: 'Backspace',
                code: 'Backspace',
                windowsVirtualKeyCode: 8,
              });
              await cdp.send('Input.insertText', { text: value });
              await sleep(100);
              return;
            }'''

          text = text[:rich_start] + new_rich + text[rich_end:]
          path.write_text(text, encoding='utf-8')
          PY

          node --check scripts/ui-smoke.mjs
          git diff --check
          git diff -- scripts/ui-smoke.mjs

      - name: Commit and push fix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ui-smoke.mjs
          git commit -m 'fix:修复长时间UI冒烟测试卡死'
          git push origin HEAD:main
