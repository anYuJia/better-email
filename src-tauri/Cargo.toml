[package]
name = "better-email"
version = "1.0.18"
description = "A local-first desktop email client focused on privacy, safety, and calm productivity."
authors = ["Better Email contributors"]
edition = "2021"

[lib]
name = "better_email_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-shell = "2.3.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-updater = "2.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32.1", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
once_cell = "1.21"
mail-parser = { version = "0.11.4", features = ["full_encoding"] }
ammonia = "4.1.3"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "pool", "hostname", "rustls-tls"] }
imap = "3.0.0-alpha.15"
imap-proto = "0.16.7"
native-tls = "0.2.14"
tauri-plugin-notification = "2.3.3"
base64 = "0.22.1"
encoding_rs = "0.8"
sha2 = "0.11.0"
libc = "0.2"
urlencoding = "2.1.3"
uuid = { version = "1.23.4", features = ["v4"] }
ureq = "3.3.0"
url = "2.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
calamine = "0.36.1"
dirs = "6.0.0"

[dev-dependencies]
tempfile = "3.27.0"
zip = "8.6"
