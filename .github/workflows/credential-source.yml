name: Credential repair source snapshot
on:
  push:
    branches: [work/credential-verification-20260907]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e3b93396f39f486c56355a8e3f94242f4d1d11a9
          persist-credentials: false
      - name: Export exact baseline without credentials or build artifacts
        run: |
          test "$(git rev-parse HEAD)" = 'e3b93396f39f486c56355a8e3f94242f4d1d11a9'
          mkdir -p source-evidence
          git rev-parse HEAD > source-evidence/HEAD.txt
          git archive --format=tar.gz HEAD > source-evidence/source.tar.gz
          git ls-tree -r HEAD > source-evidence/tree.txt
          sha256sum source-evidence/source.tar.gz > source-evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: credential-source-${{ github.run_id }}
          path: source-evidence/
          retention-days: 3
