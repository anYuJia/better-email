name: Diagnose credential PR rebase
on:
  push:
    branches: [work/credential-rebase-diagnose-20260907]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'anYuJia/better-email' && github.actor == 'yhan-sun'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 50ac5310fb1d3095826d6b023a01ca4076754fd5
          fetch-depth: 0
          persist-credentials: false
      - name: Three-way merge diagnosis
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name yhan-sun
          git config user.email 304309934+yhan-sun@users.noreply.github.com
          mkdir -p merge-diagnosis
          set +e
          git merge --no-commit --no-ff origin/main >merge-diagnosis/merge.log 2>&1
          status=$?
          set -e
          git status --short > merge-diagnosis/status.txt
          git diff --name-only --diff-filter=U > merge-diagnosis/conflicts.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            safe=$(printf '%s' "$path" | tr '/ ' '__')
            git show ":1:$path" > "merge-diagnosis/${safe}.base" 2>/dev/null || true
            git show ":2:$path" > "merge-diagnosis/${safe}.credential" 2>/dev/null || true
            git show ":3:$path" > "merge-diagnosis/${safe}.main" 2>/dev/null || true
            cp "$path" "merge-diagnosis/${safe}.markers" 2>/dev/null || true
          done < merge-diagnosis/conflicts.txt
          git diff --stat > merge-diagnosis/diff-stat.txt || true
          echo "$status" > merge-diagnosis/merge-exit.txt
          cat merge-diagnosis/conflicts.txt
      - uses: actions/upload-artifact@v4
        with:
          name: credential-rebase-diagnosis-${{ github.run_id }}
          path: merge-diagnosis/
          retention-days: 3
