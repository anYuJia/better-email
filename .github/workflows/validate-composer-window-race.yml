name: Validate Composer Window Race Fix

on:
  push:
    branches:
      - ci/validate-composer-window-race-20260827

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout fix source
        uses: actions/checkout@v4
        with:
          ref: fix/composer-window-open-race-20260827

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Full frontend tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Frontend dependency audit
        run: npm audit --audit-level=high

      - name: Version consistency
        run: |
          node -e "const pkg=require('./package.json');const conf=require('./src-tauri/tauri.conf.json');if(pkg.version!==conf.version)throw new Error(pkg.version+' != '+conf.version)"

      - name: Diff check
        run: git diff --check
