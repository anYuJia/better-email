name: Review merge verification
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: write
concurrency:
  group: review-repair-21
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.pull_request.number == 21 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/mobile-list-gestures-20260906' && github.actor == 'yhan-sun'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5c888ceb42e2539f03ec4ccf79d09aae5d0f9fa9
          persist-credentials: false
      - name: Apply exact OAuth status rejection
        shell: python
        run: |
          import hashlib, pathlib
          path = pathlib.Path('src-tauri/src/oauth.rs')
          original = path.read_bytes()
          before = hashlib.sha1(b'blob ' + str(len(original)).encode() + b'\0' + original).hexdigest()
          if before != 'a3695a88604ab139a2f70730ec381286e16ddad9':
              raise RuntimeError('OAuth source changed')
          text = original.decode()
          needle = '    let status = response.status();\n'
          if text.count(needle) != 1:
              raise RuntimeError('Ambiguous OAuth status check')
          result = text.replace(needle, needle + '    if !status.is_success() {\n        return Err(format!("OAuth2 token 端点返回 HTTP {status}，请求已拒绝。"));\n    }\n').encode()
          if hashlib.sha256(result).hexdigest() != '343b33d3a08f8f86f903519eb3654432e56c2af77cebb267a27072057fda516d':
              raise RuntimeError('OAuth result checksum mismatch')
          path.write_bytes(result)
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting and export exact source blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          git diff --check
          mkdir -p merge-evidence
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          path = pathlib.Path('src-tauri/src/oauth.rs')
          data = path.read_bytes()
          expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          payload = json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()})
          value = json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/anYuJia/better-email/git/blobs', '--input', '-'], input=payload.encode()))
          if value['sha'] != expected:
              raise RuntimeError('Uploaded source differs')
          pathlib.Path('merge-evidence/source.json').write_text(json.dumps({'base': '5c888ceb42e2539f03ec4ccf79d09aae5d0f9fa9', 'path': str(path), 'sha': value['sha']}, indent=2))
          print('Verified OAuth blob:', value['sha'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: merge-source-${{ github.run_id }}
          path: merge-evidence/source.json
          retention-days: 7
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Full Rust regression
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee merge-evidence/rust.log
      - name: Strict native lint
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | tee merge-evidence/clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merge-verification-${{ github.run_id }}
          path: merge-evidence/
          retention-days: 14
