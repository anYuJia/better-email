name: Header repair native verification
on:
  push:
    branches: [work/header-rust-check-20260907]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'anYuJia/better-email'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4d82528cc0e57501566963c11be378e3e289ee8d
          persist-credentials: false
      - name: Record exact tested source
        run: |
          test "$(git rev-parse HEAD)" = '4d82528cc0e57501566963c11be378e3e289ee8d'
          mkdir -p native-evidence
          git rev-parse HEAD > native-evidence/source-sha.txt
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Full Rust regression
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee native-evidence/rust.log
      - name: Strict native lint
        if: '!cancelled()'
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | tee native-evidence/clippy.log
      - name: Rust formatting
        if: '!cancelled()'
        run: |
          set -o pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check 2>&1 | tee native-evidence/format.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: header-native-${{ github.run_id }}
          path: native-evidence/
          retention-days: 7
