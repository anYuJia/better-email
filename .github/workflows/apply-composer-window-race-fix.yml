name: Apply Composer Window Race Fix

on:
  push:
    branches:
      - fix/composer-window-open-race-20260827

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.head_commit.message != 'feat:完成写信窗口竞态修复'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/composer-window-open-race-20260827
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply standalone composer race fix
        run: python scripts/apply-composer-window-race-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Validate regression
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npx vitest run src/app/composerWindowOpenPolicy.test.ts
          npm run build
          git diff --check

      - name: Commit validated source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/StandaloneComposerApp.tsx
          git commit -m 'feat:完成写信窗口竞态修复'
          git push origin HEAD:fix/composer-window-open-race-20260827
