name: Apply Desktop Regression Fix

on:
  push:
    branches:
      - 'ci/fix-desktop-regressions-20260827'

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch macOS Dock and composer close
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lib = Path('src-tauri/src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          needle = 'tauri::ActivationPolicy::Accessory'
          if text.count(needle) != 1:
              raise SystemExit(f'unexpected activation policy count: {text.count(needle)}')
          lib.write_text(text.replace(needle, 'tauri::ActivationPolicy::Regular', 1), encoding='utf-8')

          composer = Path('src/components/StandaloneComposerApp.tsx')
          text = composer.read_text(encoding='utf-8')
          old_ref = "  const closeComposerRef = useRef<() => void>(() => {});\n  const applyComposerRequestRef = useRef<("
          new_ref = "  const closeComposerRef = useRef<() => void>(() => {});\n  const draftRef = useRef(emptyDraft);\n  const applyComposerRequestRef = useRef<("
          if text.count(old_ref) != 1:
              raise SystemExit(f'unexpected composer ref count: {text.count(old_ref)}')
          text = text.replace(old_ref, new_ref, 1)

          old_assign = "  closeComposerRef.current = closeComposer;\n\n  const applyComposerRequest = useCallback"
          new_assign = "  closeComposerRef.current = closeComposer;\n  draftRef.current = draft;\n\n  const applyComposerRequest = useCallback"
          if text.count(old_assign) != 1:
              raise SystemExit(f'unexpected draft assignment count: {text.count(old_assign)}')
          text = text.replace(old_assign, new_assign, 1)

          old_close = "        const nextUnlisten = await onCurrentWindowCloseRequested((event) => {\n          if (closingRef.current) return;\n          event.preventDefault();\n          closeComposerRef.current();\n        });"
          new_close = "        const nextUnlisten = await onCurrentWindowCloseRequested((event) => {\n          if (closingRef.current) return;\n          event.preventDefault();\n          if (isDraftEmpty(draftRef.current)) {\n            closingRef.current = true;\n            emitToMain(COMPOSER_CLOSED_EVENT)\n              .catch(() => undefined)\n              .finally(() => {\n                closeCurrentWindow().catch(() => undefined);\n              });\n            return;\n          }\n          closeComposerRef.current();\n        });"
          if text.count(old_close) != 1:
              raise SystemExit(f'unexpected close handler count: {text.count(old_close)}')
          composer.write_text(text.replace(old_close, new_close, 1), encoding='utf-8')
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          git diff --check
          git diff -- src-tauri/src/lib.rs src/components/StandaloneComposerApp.tsx

      - name: Commit and push fixes to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/lib.rs src/components/StandaloneComposerApp.tsx
          git commit -m 'feat:修复macOS Dock图标与写信窗口关闭'
          git push origin HEAD:main
