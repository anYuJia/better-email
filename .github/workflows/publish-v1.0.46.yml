name: Publish v1.0.46

on:
  push:
    branches:
      - 'release/v1.0.46-publish'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: r26b
  ANDROID_BUILD_TOOLS_VERSION: '36.0.0'
  RELEASE_TAG: v1.0.46
  RELEASE_TARGET_SHA: 1f038b65580af4aec8ef8b96926a726302044b29

jobs:
  build-desktop:
    name: Build release installer (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Require updater signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo "::error::missing TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
      - name: Build signed installers
        run: npm run tauri:build
      - name: Prepare canonical release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/ci-prepare-assets.mjs --version="$VERSION" --bundle="src-tauri/target/release/bundle" > asset-plan.json
          cat asset-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  build-android:
    name: Build Android release
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"
      - name: Setup Android NDK
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          add-to-path: true
      - name: Export Android NDK paths
        shell: bash
        run: |
          NDK_PATH="${{ steps.setup_ndk.outputs['ndk-path'] }}"
          TOOLCHAIN_BIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$TOOLCHAIN_BIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Require Android signing secrets
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEY_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "::error::missing $name"; exit 1; }
          done
      - run: npm run tauri -- android init --ci --skip-targets-install
      - run: npm run tauri -- icon src-tauri/icons/icon.png
      - name: Build Android artifacts
        run: npm run tauri -- android build --ci --target aarch64 --apk --aab
      - name: Sign and prepare Android release assets
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/prepare-android-artifacts.mjs --outputs="src-tauri/gen/android/app/build/outputs" --output="release-assets" --version="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release v1.0.46
    needs: [build-desktop, build-android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Verify assets and generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          MAC="dist/installers-macos-latest"
          WIN="dist/installers-windows-latest"
          ANDROID="dist/android-${GITHUB_SHA}"
          required=(
            "$MAC/Better_Email_${VERSION}_mac_arm.dmg"
            "$MAC/Better_Email_${VERSION}_mac_arm.app.tar.gz"
            "$MAC/Better_Email_${VERSION}_mac_arm.app.tar.gz.sig"
            "$WIN/Better_Email_${VERSION}_windows_x64.msi"
            "$WIN/Better_Email_${VERSION}_windows_x64.msi.sig"
            "$ANDROID/Better_Email_${VERSION}_android_arm64.apk"
            "$ANDROID/Better_Email_${VERSION}_android_arm64.aab"
          )
          for file in "${required[@]}"; do test -s "$file" || { echo "::error::missing $file"; exit 1; }; done
          node scripts/update-manifest.mjs \
            --version="$VERSION" \
            --tag="$RELEASE_TAG" \
            --repo="$GITHUB_REPOSITORY" \
            --payload-darwin-aarch64="$MAC/Better_Email_${VERSION}_mac_arm.app.tar.gz" \
            --payload-windows-x86_64="$WIN/Better_Email_${VERSION}_windows_x64.msi" \
            --out="dist/latest.json"
          test -s dist/latest.json
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          MAC="dist/installers-macos-latest"
          WIN="dist/installers-windows-latest"
          ANDROID="dist/android-${GITHUB_SHA}"
          BODY=$(cat <<'EOF'
          ## Better Email v1.0.46

          本版本完成应用架构、同步可靠性、性能预算、Inbox/Reader、联系人与写信、全局搜索、安全日志、快捷键与 AI 上下文动作的系统性优化。

          ### 重点更新
          - 应用入口拆分与架构边界检查，降低巨型模块继续膨胀的风险。
          - 后台同步加入指数退避与 jitter，提升失败恢复稳定性。
          - 建立前端性能预算并收敛桌面 Inbox / Reader 信息层级。
          - 联系人推荐升级为 VIP / 高频 / 最近排序，优化收件人输入体验。
          - 全局搜索增加未读、星标、附件等结构化筛选。
          - 日志输出统一敏感信息脱敏。
          - 完善邮件键盘操作流，并新增上下文 AI 摘要与生成回复。
          - 不引入系统钥匙链，继续沿用应用层加密凭据方案。

          ### 安装包
          - macOS Apple Silicon：DMG
          - Windows x64：MSI
          - Android ARM64：APK / AAB
          EOF
          )
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Better Email $RELEASE_TAG" --notes "$BODY"
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_TARGET_SHA" --title "Better Email $RELEASE_TAG" --notes "$BODY"
          fi
          gh release upload "$RELEASE_TAG" \
            "$MAC/Better_Email_${VERSION}_mac_arm.dmg" \
            "$MAC/Better_Email_${VERSION}_mac_arm.app.tar.gz" \
            "$MAC/Better_Email_${VERSION}_mac_arm.app.tar.gz.sig" \
            "$WIN/Better_Email_${VERSION}_windows_x64.msi" \
            "$WIN/Better_Email_${VERSION}_windows_x64.msi.sig" \
            "$ANDROID/Better_Email_${VERSION}_android_arm64.apk" \
            "$ANDROID/Better_Email_${VERSION}_android_arm64.aab" \
            "dist/latest.json" \
            --clobber
